<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 230" width="100%" height="100%" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="i-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="i-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="1120" height="230" rx="6" fill="#ffffff"/>

  <!-- Step 1: Channels & Gateway -->
  <rect x="12" y="18" width="205" height="194" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
  <rect x="12" y="18" width="205" height="20" rx="5" fill="#1e293b"/>
  <text x="114" y="32" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">1. Intake &amp; Original Archive</text>
  <text x="22" y="54" font-size="8.2" font-weight="700" fill="#0f172a">Input Channels:</text>
  <text x="22" y="68" font-size="8" fill="#334155">• Web Portal, App, Email &amp; Phone</text>
  <text x="22" y="88" font-size="8.2" font-weight="700" fill="#0f172a">Security Gateway &amp; Buffer:</text>
  <text x="22" y="102" font-size="8" fill="#334155">• Cyberattack Protection (WAF)</text>
  <text x="22" y="116" font-size="8" fill="#334155">• Asynchronous Queue Absorbs</text>
  <text x="22" y="128" font-size="8" fill="#334155">  Peak Loads (e.g., Severe Storms)</text>
  <rect x="22" y="144" width="185" height="56" rx="4" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="114" y="161" text-anchor="middle" font-size="8.2" font-weight="700" fill="#0f172a">Audit-Proof Raw Archive</text>
  <text x="114" y="175" text-anchor="middle" font-size="7.7" fill="#475569">Immutable Storage of All</text>
  <text x="114" y="187" text-anchor="middle" font-size="7.7" fill="#475569">Original Documents (BaFin Compliant)</text>

  <!-- Step 2: Specialized Azure AI Services -->
  <rect x="245" y="18" width="365" height="194" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="245" y="18" width="365" height="20" rx="5" fill="#0369a1"/>
  <text x="427" y="32" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">2. Specialized AI Extraction (Azure AI Services)</text>

  <rect x="257" y="46" width="164" height="74" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="339" y="61" text-anchor="middle" font-size="8.3" font-weight="700" fill="#0369a1">Documents &amp; Invoices</text>
  <text x="264" y="75" font-size="7.7" fill="#334155">• Auto-Splits Bundled PDFs</text>
  <text x="264" y="88" font-size="7.7" fill="#334155">• Reads Tables &amp; Amounts</text>
  <text x="264" y="101" font-size="7.7" fill="#334155">• Stores Source Coordinates</text>

  <rect x="434" y="46" width="164" height="74" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="516" y="61" text-anchor="middle" font-size="8.3" font-weight="700" fill="#0369a1">Speech &amp; Telephony</text>
  <text x="441" y="75" font-size="7.7" fill="#334155">• Automated Transcription</text>
  <text x="441" y="88" font-size="7.7" fill="#334155">• Speaker Separation</text>
  <text x="441" y="101" font-size="7.7" fill="#334155">• Insurance Domain Terms</text>

  <rect x="257" y="128" width="164" height="74" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="339" y="143" text-anchor="middle" font-size="8.3" font-weight="700" fill="#0369a1">Damage Photo Analysis</text>
  <text x="264" y="157" font-size="7.7" fill="#334155">• Detects Damaged Parts</text>
  <text x="264" y="170" font-size="7.7" fill="#334155">• Estimates Damage Severity</text>
  <text x="264" y="183" font-size="7.7" fill="#334155">• Checks Image Metadata</text>

  <rect x="434" y="128" width="164" height="74" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="516" y="143" text-anchor="middle" font-size="8.3" font-weight="700" fill="#0369a1">Medical &amp; Translation</text>
  <text x="441" y="157" font-size="7.7" fill="#334155">• Structures Medical Reports</text>
  <text x="441" y="170" font-size="7.7" fill="#334155">• Layout-Preserving</text>
  <text x="441" y="183" font-size="7.7" fill="#334155">  Foreign Doc Translation</text>

  <!-- Step 3: Privacy Anonymizer -->
  <rect x="638" y="18" width="210" height="194" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="638" y="18" width="210" height="20" rx="5" fill="#0369a1"/>
  <text x="743" y="32" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">3. Privacy Anonymization</text>
  <text x="648" y="56" font-size="8.1" font-weight="700" fill="#0f172a">Protection Before AI Access:</text>
  <text x="648" y="71" font-size="8" fill="#334155">• Detects Names, Addresses,</text>
  <text x="648" y="84" font-size="8" fill="#334155">  Bank Accounts &amp; License Plates</text>
  <text x="648" y="102" font-size="8" fill="#334155">• Replaces Sensitive Details</text>
  <text x="648" y="115" font-size="8" fill="#334155">  with Neutral Placeholders</text>
  <rect x="648" y="132" width="190" height="68" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="743" y="150" text-anchor="middle" font-size="8.1" font-weight="700" fill="#0369a1">Compliance Effect (GDPR):</text>
  <text x="743" y="165" text-anchor="middle" font-size="7.7" fill="#334155">Downstream AI Models Never</text>
  <text x="743" y="178" text-anchor="middle" font-size="7.7" fill="#334155">See Real Personal Data</text>
  <text x="743" y="191" text-anchor="middle" font-size="7.7" fill="#334155">or Bank Account Numbers.</text>

  <!-- Step 4: Dual Output Stores -->
  <rect x="876" y="18" width="232" height="88" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
  <rect x="876" y="18" width="232" height="19" rx="5" fill="#1e293b"/>
  <text x="992" y="31" text-anchor="middle" font-size="8.8" font-weight="700" fill="#ffffff">4a. Isolated Privacy Vault</text>
  <text x="886" y="51" font-size="7.9" fill="#334155">• Stores Cleartext Identity Mapping</text>
  <text x="886" y="65" font-size="7.9" font-weight="700" fill="#0f172a">• Strictly Blocked for AI Agents</text>
  <text x="886" y="79" font-size="7.9" fill="#334155">• Accessible Only for Bank Payout,</text>
  <text x="886" y="92" font-size="7.9" fill="#334155">  Letter Dispatch &amp; Human Adjuster</text>

  <rect x="876" y="124" width="232" height="88" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1.4"/>
  <rect x="876" y="124" width="232" height="19" rx="5" fill="#0369a1"/>
  <text x="992" y="137" text-anchor="middle" font-size="8.8" font-weight="700" fill="#ffffff">4b. Anonymized Claim File</text>
  <text x="886" y="157" font-size="7.9" fill="#334155">• Structured Facts &amp; Invoice Items</text>
  <text x="886" y="171" font-size="7.9" fill="#334155">• Contains Coordinates for Later</text>
  <text x="886" y="184" font-size="7.9" fill="#334155">  Highlighting in Original Document</text>
  <text x="886" y="198" font-size="7.9" font-weight="700" fill="#0369a1">• Triggers Claim Setup &amp; AI Agents</text>

  <!-- Orthogonal Connectors -->
  <path d="M 217 115 H 245" fill="none" stroke="#0284c7" stroke-width="1.6" marker-end="url(#i-blue)"/>
  <path d="M 610 115 H 638" fill="none" stroke="#0284c7" stroke-width="1.6" marker-end="url(#i-blue)"/>
  <path d="M 848 62 H 876" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#i-slate)"/>
  <path d="M 848 168 H 876" fill="none" stroke="#0284c7" stroke-width="1.6" marker-end="url(#i-blue)"/>
</svg>
