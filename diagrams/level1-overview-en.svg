<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" width="100%" height="100%" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="1120" height="330" rx="6" fill="#ffffff"/>

  <!-- Left External Column -->
  <rect x="12" y="22" width="142" height="48" rx="5" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
  <text x="83" y="42" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Policyholder</text>
  <text x="83" y="57" text-anchor="middle" font-size="8.2" fill="#475569">Submits Claim &amp; Docs</text>

  <rect x="12" y="90" width="142" height="52" rx="5" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
  <text x="83" y="110" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Input Channels</text>
  <text x="83" y="124" text-anchor="middle" font-size="8.2" fill="#475569">Portal, App, Email, Phone</text>

  <rect x="12" y="246" width="142" height="62" rx="5" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
  <text x="83" y="268" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Specialist Adjuster</text>
  <text x="83" y="283" text-anchor="middle" font-size="8.1" fill="#475569">Reviews Escalated Cases</text>
  <text x="83" y="295" text-anchor="middle" font-size="8.1" fill="#475569">with Source Highlights</text>

  <!-- Isolated Azure VNet Perimeter -->
  <rect x="174" y="8" width="934" height="314" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="190" y="25" font-size="10" font-weight="700" fill="#0369a1">Secured Azure Cloud Environment (Zero Public Internet Access / 100% Private Network Connectivity)</text>

  <!-- ROW 1: CORE WORKFLOW STAGES (y=36..124, h=88) -->
  <rect x="190" y="36" width="202" height="88" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.4"/>
  <rect x="190" y="36" width="202" height="19" rx="4" fill="#0369a1"/>
  <text x="291" y="49" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">1. Ingestion &amp; Data Privacy</text>
  <text x="198" y="66" font-size="8.1" fill="#334155">• Intake Across All Document &amp; Voice Channels</text>
  <text x="198" y="80" font-size="8.1" fill="#334155">• Structured AI Information Extraction</text>
  <text x="198" y="94" font-size="8.1" fill="#334155">• Original Archive &amp; Readability Check</text>
  <text x="198" y="108" font-size="8.1" font-weight="700" fill="#0369a1">• Early Anonymization of Personal Data</text>

  <rect x="414" y="36" width="202" height="88" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.4"/>
  <rect x="414" y="36" width="202" height="19" rx="4" fill="#0369a1"/>
  <text x="515" y="49" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">2. Classification &amp; Claim Setup</text>
  <text x="422" y="66" font-size="8.1" fill="#334155">• Categorization by Claim Type &amp; Severity</text>
  <text x="422" y="80" font-size="8.1" fill="#334155">• Customer &amp; Policy Master Data Match</text>
  <text x="422" y="94" font-size="8.1" font-weight="700" fill="#0369a1">• Binding Applicable Policy Terms</text>
  <text x="422" y="108" font-size="8.1" fill="#334155">• Binding Claim Creation in Core System</text>

  <rect x="642" y="36" width="252" height="88" rx="5" fill="#ffffff" stroke="#1e293b" stroke-width="1.6"/>
  <rect x="642" y="36" width="252" height="19" rx="4" fill="#1e293b"/>
  <text x="768" y="49" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">3. Multi-Agent Claim Review</text>
  <text x="650" y="66" font-size="8.1" font-weight="700" fill="#0f172a">• Central Orchestrator Drives Processing</text>
  <text x="650" y="80" font-size="8.1" fill="#334155">• 5 Specialized Agents (Customer, Coverage,</text>
  <text x="650" y="94" font-size="8.1" fill="#334155">  Fraud Review, Invoice &amp; Payout)</text>
  <text x="650" y="108" font-size="8.1" fill="#334155">• Internal Review Agents &amp; AI Guardrails</text>

  <rect x="920" y="36" width="174" height="88" rx="5" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
  <rect x="920" y="36" width="174" height="19" rx="4" fill="#475569"/>
  <text x="1007" y="49" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">AI Monitoring (Langfuse)</text>
  <text x="928" y="66" font-size="8.1" fill="#334155">• Privacy-Compliant Audit Logging</text>
  <text x="928" y="80" font-size="8.1" fill="#334155">• Central Prompt &amp; Playbook Mgmt</text>
  <text x="928" y="94" font-size="8.1" fill="#334155">• Continuous Quality Evaluation</text>
  <text x="928" y="108" font-size="8.1" fill="#334155">• Learning from Adjuster Feedback</text>

  <!-- ROW 2: DATA PLATFORM & RULES ENGINE (y=152..220, h=68) -->
  <rect x="190" y="152" width="426" height="68" rx="5" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <rect x="190" y="152" width="426" height="18" rx="4" fill="#334155"/>
  <text x="403" y="164" text-anchor="middle" font-size="8.9" font-weight="700" fill="#ffffff">Central Data, Knowledge &amp; Analytics Platform (Azure &amp; Databricks)</text>
  <text x="403" y="181" text-anchor="middle" font-size="8" fill="#1e293b">• Audit-Proof Original Archive, Operational Claim File &amp; Strictly Isolated Privacy Vault</text>
  <text x="403" y="195" text-anchor="middle" font-size="8" fill="#1e293b">• Policy Administration System (SQL) &amp; Policy Terms Knowledge Base (Azure AI Search)</text>
  <text x="403" y="209" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">• Azure Databricks: Cross-Claim Fraud Network Detection, Rule Simulation &amp; Actuarial Data</text>

  <rect x="642" y="152" width="252" height="68" rx="5" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
  <rect x="642" y="152" width="252" height="18" rx="4" fill="#334155"/>
  <text x="768" y="164" text-anchor="middle" font-size="8.9" font-weight="700" fill="#ffffff">Deterministic Calculation Engine</text>
  <text x="650" y="182" font-size="8.1" fill="#334155">• Unified, Versioned Rule Repository</text>
  <text x="650" y="196" font-size="8.1" fill="#334155">• Binding Limit, Cap &amp; Deductible Math</text>
  <text x="650" y="210" font-size="8.1" font-weight="700" fill="#0f172a">• Zero AI Estimation on Monetary Payouts</text>

  <rect x="920" y="152" width="174" height="68" rx="5" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
  <rect x="920" y="152" width="174" height="18" rx="4" fill="#475569"/>
  <text x="1007" y="164" text-anchor="middle" font-size="8.9" font-weight="700" fill="#ffffff">Policy Management</text>
  <text x="928" y="182" font-size="8" fill="#334155">• Business Rule Authoring</text>
  <text x="928" y="196" font-size="8" fill="#334155">• Conflict Check &amp; Simulation</text>
  <text x="928" y="210" font-size="8" font-weight="700" fill="#0f172a">• Mandatory 4-Eyes Approval</text>

  <!-- ROW 3: HITL & OUTCOMES (y=246..310, h=64) -->
  <rect x="190" y="246" width="265" height="64" rx="5" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <rect x="190" y="246" width="265" height="18" rx="4" fill="#1e293b"/>
  <text x="322" y="258" text-anchor="middle" font-size="8.9" font-weight="700" fill="#ffffff">4. Safety Guardrails &amp; Human Review (HITL)</text>
  <text x="198" y="275" font-size="8" font-weight="700" fill="#0f172a">• No Automated Rejection (GDPR Art. 22)</text>
  <text x="198" y="288" font-size="8" fill="#334155">• Escalation on High Value, Fraud &amp; Ambiguity</text>
  <text x="198" y="301" font-size="8" fill="#334155">• Decision Brief with Source Highlighting</text>

  <rect x="482" y="246" width="612" height="64" rx="5" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
  <rect x="482" y="246" width="612" height="18" rx="4" fill="#0369a1"/>
  <text x="788" y="258" text-anchor="middle" font-size="8.9" font-weight="700" fill="#ffffff">Defined Claims Processing Outcomes</text>

  <rect x="494" y="269" width="188" height="35" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
  <text x="588" y="284" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">1. Dark Processing (STP)</text>
  <text x="588" y="297" text-anchor="middle" font-size="7.6" fill="#475569">Direct Payout &amp; Settlement Letter</text>

  <rect x="694" y="269" width="188" height="35" rx="4" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="788" y="284" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">2. Customer Dialogue Loop</text>
  <text x="788" y="297" text-anchor="middle" font-size="7.6" fill="#475569">Targeted Follow-Up for Missing Docs</text>

  <rect x="894" y="269" width="188" height="35" rx="4" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="988" y="284" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">3. Specialist Resolution (HITL)</text>
  <text x="988" y="297" text-anchor="middle" font-size="7.6" fill="#475569">Final Decision by Human Adjuster</text>

