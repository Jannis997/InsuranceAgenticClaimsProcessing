<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 348" width="100%" height="100%" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="m-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="1120" height="348" rx="6" fill="#ffffff"/>

  <!-- TOP ROW: CONTROL PLANE (y=10..76, h=66) -->
  <rect x="14" y="10" width="180" height="66" rx="5" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
  <rect x="14" y="10" width="180" height="18" rx="4" fill="#334155"/>
  <text x="104" y="22" text-anchor="middle" font-size="8.8" font-weight="700" fill="#ffffff">0. Auftrags-Warteschlange</text>
  <text x="104" y="40" text-anchor="middle" font-size="8" fill="#334155">Geordnete Fall-Übergabe</text>
  <text x="104" y="54" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Strikte Reihenfolge je Akte</text>
  <text x="104" y="67" text-anchor="middle" font-size="7.6" fill="#475569">Entkoppelt Lastspitzen</text>

  <rect x="218" y="10" width="186" height="66" rx="5" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
  <rect x="218" y="10" width="186" height="18" rx="4" fill="#334155"/>
  <text x="311" y="22" text-anchor="middle" font-size="8.8" font-weight="700" fill="#ffffff">1. Schadensart-Vorbereitung</text>
  <text x="311" y="40" text-anchor="middle" font-size="8" fill="#334155">Lädt Dokumenten-Checkliste</text>
  <text x="311" y="54" text-anchor="middle" font-size="8" fill="#334155">&amp; Prüfplan für die Sparte</text>
  <text x="311" y="67" text-anchor="middle" font-size="7.6" font-weight="700" fill="#0369a1">(z. B. Glas, Wasser, Kfz)</text>

  <rect x="428" y="10" width="390" height="66" rx="5" fill="#f8fafc" stroke="#0284c7" stroke-width="1.7"/>
  <rect x="428" y="10" width="390" height="18" rx="4" fill="#0369a1"/>
  <text x="623" y="22" text-anchor="middle" font-size="9.4" font-weight="700" fill="#ffffff">2. Zentraler Claims Orchestrator (Prozess-Steuerung)</text>
  <text x="623" y="39" text-anchor="middle" font-size="8" fill="#0f172a">• Koordiniert die 5 Spezial-Agenten Schritt für Schritt nach Prüfplan</text>
  <text x="623" y="52" text-anchor="middle" font-size="8" fill="#334155">• Schutzschilde gegen manipulierte Dokumente &amp; unbelegte Aussagen</text>
  <text x="623" y="65" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">• Pausiert Vorgänge nahtlos, wenn Kundenbelege nachgefordert werden</text>

  <rect x="842" y="10" width="264" height="66" rx="5" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <rect x="842" y="10" width="264" height="18" rx="4" fill="#1e293b"/>
  <text x="974" y="22" text-anchor="middle" font-size="8.8" font-weight="700" fill="#ffffff">Sicherheits-Schranke &amp; HITL-Übergabe</text>
  <text x="850" y="39" font-size="8" font-weight="700" fill="#0f172a">• Keine automatische Ablehnung (DSGVO)</text>
  <text x="850" y="52" font-size="8" fill="#334155">• Stoppt KI bei Betrugsverdacht &amp; Limits</text>
  <text x="850" y="65" font-size="8" font-weight="700" fill="#0369a1">• Übergabe an Spezial-Sachbearbeiter</text>

  <!-- MIDDLE ROW: 5 SPECIALIZED AGENTS (y=102..232, h=130) -->
  <rect x="14" y="102" width="202" height="130" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.4"/>
  <rect x="14" y="102" width="202" height="18" rx="4" fill="#0369a1"/>
  <text x="115" y="114" text-anchor="middle" font-size="8.8" font-weight="700" fill="#ffffff">A1. Kundenkommunikation</text>
  <rect x="22" y="126" width="186" height="25" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="115" y="137" text-anchor="middle" font-size="7.8" font-weight="700" fill="#0f172a">Interne Qualitäts- &amp; Zitatprüfung</text>
  <text x="115" y="147" text-anchor="middle" font-size="7.3" fill="#475569">Prüft jedes Schreiben vor Versand</text>
  <text x="22" y="166" font-size="7.9" fill="#334155">• Prüft Vollständigkeit der Belege</text>
  <text x="22" y="181" font-size="7.9" fill="#334155">• Fordert fehlende Dokumente an</text>
  <text x="22" y="196" font-size="7.9" font-weight="700" fill="#0f172a">• Erstellt Abrechnungsschreiben</text>
  <text x="22" y="211" font-size="7.5" fill="#475569">  inkl. passender Bedingungs-Zitate</text>

  <rect x="234" y="102" width="202" height="130" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.4"/>
  <rect x="234" y="102" width="202" height="18" rx="4" fill="#0369a1"/>
  <text x="335" y="114" text-anchor="middle" font-size="8.8" font-weight="700" fill="#ffffff">A2. Deckungs-Vorprüfung</text>
  <rect x="242" y="126" width="186" height="25" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="335" y="137" text-anchor="middle" font-size="7.8" font-weight="700" fill="#0f172a">Inhaltlicher Klausel-Abgleich</text>
  <text x="335" y="147" text-anchor="middle" font-size="7.3" fill="#475569">Bereitet Fakten für Rechen-Engine auf</text>
  <text x="242" y="166" font-size="7.9" fill="#334155">• Liest Vertragsstatus &amp; Baustein</text>
  <text x="242" y="181" font-size="7.9" font-weight="700" fill="#0f172a">• Gleicht Schadenursache mit den</text>
  <text x="242" y="194" font-size="7.9" font-weight="700" fill="#0f172a">  gültigen Bedingungen (AVB) ab</text>
  <text x="242" y="211" font-size="7.9" fill="#334155">• Markiert relevante Ausschlüsse</text>

  <rect x="454" y="102" width="202" height="130" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.4"/>
  <rect x="454" y="102" width="202" height="18" rx="4" fill="#0369a1"/>
  <text x="555" y="114" text-anchor="middle" font-size="8.8" font-weight="700" fill="#ffffff">A3. Betrugs- &amp; Risikoprüfung</text>
  <rect x="462" y="126" width="186" height="25" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="555" y="137" text-anchor="middle" font-size="7.8" font-weight="700" fill="#0f172a">Beleg- &amp; Netzwerk-Prüfung</text>
  <text x="555" y="147" text-anchor="middle" font-size="7.3" fill="#475569">Einzelfall + Databricks-Abfrage</text>
  <text x="462" y="166" font-size="7.9" fill="#334155">• Prüft Fotos auf Dubletten</text>
  <text x="462" y="181" font-size="7.9" fill="#334155">• Prüft Vorschadenhistorie im Vertrag</text>
  <text x="462" y="196" font-size="7.9" font-weight="700" fill="#0f172a">• Fragt Betrugsnetzwerk-Score</text>
  <text x="462" y="209" font-size="7.9" font-weight="700" fill="#0f172a">  (Werkstatt/Gutachter) ab</text>

  <rect x="674" y="102" width="206" height="130" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.4"/>
  <rect x="674" y="102" width="206" height="18" rx="4" fill="#0369a1"/>
  <text x="777" y="114" text-anchor="middle" font-size="8.8" font-weight="700" fill="#ffffff">A4. Rechnungs- &amp; Positionsprüfung</text>
  <rect x="682" y="126" width="190" height="25" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="777" y="137" text-anchor="middle" font-size="7.8" font-weight="700" fill="#0f172a">Interne Positions-Kontrolle</text>
  <text x="777" y="147" text-anchor="middle" font-size="7.3" fill="#475569">Validiert zugeordnete Leistungsarten</text>
  <text x="682" y="166" font-size="7.9" fill="#334155">• Übersetzt Rechnungszeilen in</text>
  <text x="682" y="179" font-size="7.9" fill="#334155">  normierte Reparaturpositionen</text>
  <text x="682" y="196" font-size="7.9" font-weight="700" fill="#0f172a">• Übergibt an Rechen-Engine</text>
  <text x="682" y="209" font-size="7.5" fill="#475569">  zur verbindlichen Kalkulation</text>

  <rect x="898" y="102" width="208" height="130" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.4"/>
  <rect x="898" y="102" width="208" height="18" rx="4" fill="#0369a1"/>
  <text x="1002" y="114" text-anchor="middle" font-size="8.8" font-weight="700" fill="#ffffff">A5. Auszahlung &amp; Buchung</text>
  <rect x="906" y="126" width="192" height="25" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="1002" y="137" text-anchor="middle" font-size="7.8" font-weight="700" fill="#0f172a">Geschützte Zahlungsfreigabe</text>
  <text x="1002" y="147" text-anchor="middle" font-size="7.3" fill="#475569">Nur bei vollständiger STP-Freigabe</text>
  <text x="906" y="166" font-size="7.9" fill="#334155">• Aktualisiert Schadenrückstellungen</text>
  <text x="906" y="181" font-size="7.9" font-weight="700" fill="#0f172a">• Löst IBAN im Datenschutz-Tresor auf</text>
  <text x="906" y="196" font-size="7.9" fill="#334155">• Bucht SEPA-Auszahlung im SAP</text>
  <text x="906" y="211" font-size="7.9" fill="#334155">• Schließt die Schadenakte ab</text>

  <!-- BOTTOM ROW: 1:1 ALIGNED SYSTEM & DATA ACCESS PER AGENT (y=258..338, h=80) -->
  <rect x="14" y="258" width="202" height="80" rx="5" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
  <rect x="14" y="258" width="202" height="17" rx="4" fill="#334155"/>
  <text x="115" y="269" text-anchor="middle" font-size="8.2" font-weight="700" fill="#ffffff">Schadenakte, AVB-Suche &amp; Tresor</text>
  <text x="22" y="286" font-size="7.6" fill="#334155">• Liest offene Checkliste aus Akte</text>
  <text x="22" y="300" font-size="7.6" font-weight="700" fill="#0369a1">• Holt AVB-Zitate (Azure AI Search)</text>
  <text x="22" y="314" font-size="7.6" font-weight="700" fill="#0f172a">• Löst Adresse erst für Versand auf</text>
  <text x="22" y="327" font-size="7.4" fill="#475569">  (Zugriff auf Datenschutz-Tresor)</text>

  <rect x="234" y="258" width="202" height="80" rx="5" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
  <rect x="234" y="258" width="202" height="17" rx="4" fill="#334155"/>
  <text x="335" y="269" text-anchor="middle" font-size="8.2" font-weight="700" fill="#ffffff">Bestandssystem &amp; Bedingungswerk</text>
  <text x="242" y="286" font-size="7.6" font-weight="700" fill="#0f172a">• Liest Vertrag &amp; Bausteine (SQL)</text>
  <text x="242" y="300" font-size="7.6" fill="#334155">• Sucht Deckungs- &amp; Ausschluss-</text>
  <text x="242" y="313" font-size="7.6" fill="#334155">  klauseln der Vertragsgeneration</text>
  <text x="242" y="327" font-size="7.4" font-weight="700" fill="#0369a1">  in Azure AI Search</text>

  <rect x="454" y="258" width="202" height="80" rx="5" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
  <rect x="454" y="258" width="202" height="17" rx="4" fill="#334155"/>
  <text x="555" y="269" text-anchor="middle" font-size="8.2" font-weight="700" fill="#ffffff">Bild-Archiv, Bestand &amp; Databricks</text>
  <text x="462" y="286" font-size="7.6" fill="#334155">• Prüft Foto-Hashes im Roh-Archiv</text>
  <text x="462" y="300" font-size="7.6" fill="#334155">• Liest Vorschäden im Bestand (SQL)</text>
  <text x="462" y="314" font-size="7.6" font-weight="700" fill="#0f172a">• Berechnet in Azure Databricks</text>
  <text x="462" y="327" font-size="7.6" font-weight="700" fill="#0369a1">  Echtzeit-Betrugsnetzwerk-Score</text>

  <rect x="674" y="258" width="206" height="80" rx="5" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
  <rect x="674" y="258" width="206" height="17" rx="4" fill="#334155"/>
  <text x="777" y="269" text-anchor="middle" font-size="8.2" font-weight="700" fill="#ffffff">Tarif-Richtlinien &amp; Rechen-Engine</text>
  <text x="682" y="286" font-size="7.6" fill="#334155">• Gleicht Reparatur-Richtlinien ab</text>
  <text x="682" y="300" font-size="7.6" font-weight="700" fill="#0f172a">• Übergibt Positionen an die</text>
  <text x="682" y="313" font-size="7.6" font-weight="700" fill="#0f172a">  deterministische Rechen-Engine</text>
  <text x="682" y="327" font-size="7.4" fill="#475569">• Erhält exakten Auszahlungsbetrag</text>

  <rect x="898" y="258" width="208" height="80" rx="5" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
  <rect x="898" y="258" width="208" height="17" rx="4" fill="#334155"/>
  <text x="1002" y="269" text-anchor="middle" font-size="8.2" font-weight="700" fill="#ffffff">Datenschutz-Tresor, Bestand &amp; SAP</text>
  <text x="906" y="286" font-size="7.6" font-weight="700" fill="#0f172a">• Löst IBAN im Tresor auf</text>
  <text x="906" y="300" font-size="7.6" font-weight="700" fill="#0369a1">• Führt SEPA-Zahlung in SAP aus</text>
  <text x="906" y="314" font-size="7.6" fill="#334155">• Aktualisiert Schadenreserve &amp;</text>
  <text x="906" y="327" font-size="7.6" fill="#334155">  schließt Akte im Bestandssystem</text>

  <!-- ORTHOGONAL BUS ROUTING -->
  <path d="M 194 43 H 218" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#m-slate)"/>
  <path d="M 404 43 H 428" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#m-blue)"/>
  <path d="M 818 43 H 842" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#m-slate)"/>

  <!-- Orchestrator to 5 Agents -->
  <path d="M 623 76 V 89" fill="none" stroke="#0284c7" stroke-width="1.6"/>
  <path d="M 115 89 H 1002" fill="none" stroke="#0284c7" stroke-width="1.5"/>
  <path d="M 115 89 V 102" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#m-blue)"/>
  <path d="M 335 89 V 102" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#m-blue)"/>
  <path d="M 555 89 V 102" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#m-blue)"/>
  <path d="M 777 89 V 102" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#m-blue)"/>
  <path d="M 1002 89 V 102" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#m-blue)"/>

  <!-- Direct 1:1 Vertical Connectors from each Agent to its System Access Box -->
  <path d="M 115 232 V 258" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#m-slate)"/>
  <path d="M 335 232 V 258" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#m-slate)"/>
  <path d="M 555 232 V 258" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#m-slate)"/>
  <path d="M 777 232 V 258" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#m-slate)"/>
  <path d="M 1002 232 V 258" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#m-slate)"/>
</svg>
