<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" width="100%" height="100%" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="m-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="1120" height="340" rx="6" fill="#ffffff"/>

  <!-- TOP ROW: CONTROL PLANE (y=10..76, h=66) -->
  <rect x="14" y="10" width="180" height="66" rx="5" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
  <rect x="14" y="10" width="180" height="18" rx="4" fill="#334155"/>
  <text x="104" y="22" text-anchor="middle" font-size="8.8" font-weight="700" fill="#ffffff">0. Auftrags-Warteschlange</text>
  <text x="104" y="40" text-anchor="middle" font-size="8" fill="#334155">Azure Service Bus</text>
  <text x="104" y="54" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Geordnete Fall-Reihenfolge</text>
  <text x="104" y="67" text-anchor="middle" font-size="7.6" fill="#475569">Entkoppelt Lastspitzen</text>

  <rect x="218" y="10" width="186" height="66" rx="5" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
  <rect x="218" y="10" width="186" height="18" rx="4" fill="#334155"/>
  <text x="311" y="22" text-anchor="middle" font-size="8.8" font-weight="700" fill="#ffffff">1. Schadensart-Vorbereitung</text>
  <text x="311" y="40" text-anchor="middle" font-size="8" fill="#334155">Lädt Dokumenten-Checkliste</text>
  <text x="311" y="54" text-anchor="middle" font-size="8" fill="#334155">&amp; Arbeitsanweisungen</text>
  <text x="311" y="67" text-anchor="middle" font-size="7.6" font-weight="700" fill="#0369a1">Je nach gemeldeter Sparte</text>

  <rect x="428" y="10" width="390" height="66" rx="5" fill="#f8fafc" stroke="#0284c7" stroke-width="1.7"/>
  <rect x="428" y="10" width="390" height="18" rx="4" fill="#0369a1"/>
  <text x="623" y="22" text-anchor="middle" font-size="9.4" font-weight="700" fill="#ffffff">2. Zentraler Claims Orchestrator (Microsoft Foundry)</text>
  <text x="623" y="39" text-anchor="middle" font-size="8" fill="#0f172a">• Steuert die 5 Spezial-Agenten flexibel nach Schadensart-Playbook</text>
  <text x="623" y="52" text-anchor="middle" font-size="8" fill="#334155">• Integrierte KI-Schutzschilde gegen Manipulation &amp; Halluzinationen</text>
  <text x="623" y="65" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">• Pausiert Vorgänge nahtlos, wenn Kundenbelege nachgefordert werden</text>

  <rect x="842" y="10" width="264" height="66" rx="5" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <rect x="842" y="10" width="264" height="18" rx="4" fill="#1e293b"/>
  <text x="974" y="22" text-anchor="middle" font-size="8.8" font-weight="700" fill="#ffffff">Sicherheits-Schranke &amp; HITL-Weiche</text>
  <text x="850" y="39" font-size="8" font-weight="700" fill="#0f172a">• Keine automatische Ablehnung (DSGVO)</text>
  <text x="850" y="52" font-size="8" fill="#334155">• Pfad 1 (Beleg-Bestätigung): Zurück an KI</text>
  <text x="850" y="65" font-size="8" font-weight="700" fill="#0369a1">• Pfad 2 (Fach-Entscheid): Direkte Buchung</text>

  <!-- MIDDLE ROW: 5 SPECIALIZED AGENTS (y=102..232, h=130) -->
  <rect x="14" y="102" width="202" height="130" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.4"/>
  <rect x="14" y="102" width="202" height="18" rx="4" fill="#0369a1"/>
  <text x="115" y="114" text-anchor="middle" font-size="8.8" font-weight="700" fill="#ffffff">A1. Kundenkommunikation</text>
  <rect x="22" y="126" width="186" height="25" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="115" y="137" text-anchor="middle" font-size="7.8" font-weight="700" fill="#0f172a">Interne Qualitäts- &amp; Zitatprüfung</text>
  <text x="115" y="147" text-anchor="middle" font-size="7.3" fill="#475569">Prüft jedes Schreiben vor Versand</text>
  <text x="22" y="166" font-size="7.9" fill="#334155">• Prüft Vollständigkeit der Belege</text>
  <text x="22" y="181" font-size="7.9" fill="#334155">• Fordert fehlende Dokumente an</text>
  <text x="22" y="196" font-size="7.9" font-weight="700" fill="#0f172a">• Erstellt Abrechnungsschreiben</text>
  <text x="22" y="211" font-size="7.5" fill="#475569">  (Empfängerdaten erst beim Versand)</text>

  <rect x="234" y="102" width="202" height="130" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.4"/>
  <rect x="234" y="102" width="202" height="18" rx="4" fill="#0369a1"/>
  <text x="335" y="114" text-anchor="middle" font-size="8.8" font-weight="700" fill="#ffffff">A2. Deckungsprüfung</text>
  <rect x="242" y="126" width="186" height="25" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="335" y="137" text-anchor="middle" font-size="7.8" font-weight="700" fill="#0f172a">Historische Vertragsbindung</text>
  <text x="335" y="147" text-anchor="middle" font-size="7.3" fill="#475569">Kein Mischen von Tarifgenerationen</text>
  <text x="242" y="166" font-size="7.9" fill="#334155">• Liest Vertrag, Limits &amp; Selbstbehalt</text>
  <text x="242" y="181" font-size="7.9" font-weight="700" fill="#0f172a">• Prüft exakt die bei Abschluss</text>
  <text x="242" y="194" font-size="7.9" font-weight="700" fill="#0f172a">  gültigen Bedingungen (AVB)</text>
  <text x="242" y="211" font-size="7.9" fill="#334155">• Dokumentiert Deckungsentscheid</text>

  <rect x="454" y="102" width="202" height="130" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.4"/>
  <rect x="454" y="102" width="202" height="18" rx="4" fill="#0369a1"/>
  <text x="555" y="114" text-anchor="middle" font-size="8.8" font-weight="700" fill="#ffffff">A3. Betrugs- &amp; Risikoprüfung</text>
  <rect x="462" y="126" width="186" height="25" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="555" y="137" text-anchor="middle" font-size="7.8" font-weight="700" fill="#0f172a">Einzelfall- &amp; Netzwerk-Analyse</text>
  <text x="555" y="147" text-anchor="middle" font-size="7.3" fill="#475569">Kombiniert Bildprüfung &amp; Databricks</text>
  <text x="462" y="166" font-size="7.9" fill="#334155">• Prüft Fotos auf Mehrfacheinreichung</text>
  <text x="462" y="181" font-size="7.9" fill="#334155">• Prüft Vorschadenhistorie im Bestand</text>
  <text x="462" y="196" font-size="7.9" font-weight="700" fill="#0f172a">• Erkennt Betrugsringe über</text>
  <text x="462" y="209" font-size="7.9" font-weight="700" fill="#0f172a">  Werkstätten &amp; Gutachter hinweg</text>

  <rect x="674" y="102" width="206" height="130" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.4"/>
  <rect x="674" y="102" width="206" height="18" rx="4" fill="#0369a1"/>
  <text x="777" y="114" text-anchor="middle" font-size="8.8" font-weight="700" fill="#ffffff">A4. Rechnungs- &amp; Tarifprüfung</text>
  <rect x="682" y="126" width="190" height="25" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="777" y="137" text-anchor="middle" font-size="7.8" font-weight="700" fill="#0f172a">Interne Tarifcode-Kontrolle</text>
  <text x="777" y="147" text-anchor="middle" font-size="7.3" fill="#475569">Validiert Gebühren-Zuordnung</text>
  <text x="682" y="166" font-size="7.9" fill="#334155">• Ordnet Rechnungspositionen</text>
  <text x="682" y="179" font-size="7.9" fill="#334155">  offiziellen Reparaturcodes zu</text>
  <text x="682" y="196" font-size="7.9" font-weight="700" fill="#0f172a">• Übergibt an Rechen-Engine</text>
  <text x="682" y="209" font-size="7.5" fill="#475569">  (Keine KI-Schätzung von Beträgen!)</text>

  <rect x="898" y="102" width="208" height="130" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.4"/>
  <rect x="898" y="102" width="208" height="18" rx="4" fill="#0369a1"/>
  <text x="1002" y="114" text-anchor="middle" font-size="8.8" font-weight="700" fill="#ffffff">A5. Auszahlung &amp; Buchung</text>
  <rect x="906" y="126" width="192" height="25" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="1002" y="137" text-anchor="middle" font-size="7.8" font-weight="700" fill="#0f172a">Geschützte Zahlungsfreigabe</text>
  <text x="1002" y="147" text-anchor="middle" font-size="7.3" fill="#475569">Nur bei vollständiger STP-Freigabe</text>
  <text x="906" y="166" font-size="7.9" fill="#334155">• Aktualisiert Schadenrückstellungen</text>
  <text x="906" y="181" font-size="7.9" font-weight="700" fill="#0f172a">• Löst Bankverbindung im Tresor auf</text>
  <text x="906" y="196" font-size="7.9" fill="#334155">• Bucht SEPA-Auszahlung im SAP</text>
  <text x="906" y="211" font-size="7.9" fill="#334155">• Schließt die Schadenakte ab</text>

  <!-- BOTTOM ROW: BACKENDS (y=258..330, h=72) -->
  <rect x="14" y="258" width="202" height="72" rx="5" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
  <rect x="14" y="258" width="202" height="17" rx="4" fill="#334155"/>
  <text x="115" y="269" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">Schadenakte &amp; Datenschutz-Tresor</text>
  <text x="22" y="286" font-size="7.8" fill="#334155">• Speichert gesamten Bearbeitungsstand</text>
  <text x="22" y="300" font-size="7.8" font-weight="700" fill="#0f172a">• Isolierte Klartext-Kundendaten</text>
  <text x="22" y="314" font-size="7.8" fill="#334155">• Revisionssichere Protokollierung</text>

  <rect x="234" y="258" width="202" height="72" rx="5" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
  <rect x="234" y="258" width="202" height="17" rx="4" fill="#334155"/>
  <text x="335" y="269" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">Bedingungswerk (Azure AI Search)</text>
  <text x="242" y="286" font-size="7.8" fill="#334155">• Alle historischen Tarifgenerationen</text>
  <text x="242" y="300" font-size="7.8" font-weight="700" fill="#0f172a">• Wortgenaue Paragraphen-Suche</text>
  <text x="242" y="314" font-size="7.8" fill="#334155">• Liefert Originalzitate für Schreiben</text>

  <rect x="454" y="258" width="202" height="72" rx="5" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
  <rect x="454" y="258" width="202" height="17" rx="4" fill="#334155"/>
  <text x="555" y="269" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">Azure Databricks Analyseplattform</text>
  <text x="462" y="286" font-size="7.8" fill="#334155">• Übergreifende Betrugsnetzwerk-KI</text>
  <text x="462" y="300" font-size="7.8" font-weight="700" fill="#0f172a">• Entlastet operative Datenbanken</text>
  <text x="462" y="314" font-size="7.8" fill="#334155">• Aktuariat &amp; Solvency-II-Berichte</text>

  <rect x="674" y="258" width="206" height="72" rx="5" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
  <rect x="674" y="258" width="206" height="17" rx="4" fill="#334155"/>
  <text x="777" y="269" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">Deterministische Rechen-Engine</text>
  <text x="682" y="286" font-size="7.8" fill="#334155">• Verbindliches Vertrags- &amp; Kulanzrecht</text>
  <text x="682" y="300" font-size="7.8" font-weight="700" fill="#0f172a">• Centgenaue Erstattungsberechnung</text>
  <text x="682" y="314" font-size="7.8" fill="#334155">• Jede Regeländerung 4-Augen-geprüft</text>

  <rect x="898" y="258" width="208" height="72" rx="5" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
  <rect x="898" y="258" width="208" height="17" rx="4" fill="#334155"/>
  <text x="1002" y="269" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">Bestandssystem &amp; SAP-Zahlung</text>
  <text x="906" y="286" font-size="7.8" fill="#334155">• Vertrags- &amp; Deckungsstammdaten</text>
  <text x="906" y="300" font-size="7.8" font-weight="700" fill="#0f172a">• Verbindliche SEPA-Auszahlung</text>
  <text x="906" y="314" font-size="7.8" fill="#334155">• Hauptbuch- &amp; Reservebuchung</text>

